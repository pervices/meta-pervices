#@TYPE: Machine
#@NAME: Per Vices Chestnut
#@DESCRIPTION: Layer for Per Vices Chestnut SDR Platform

require conf/machine/stratix10_htile.conf

# The config to use to boot from SD with ATF. Other options are in stratix10_htile.conf.
UBOOT_CONFIG = "stratix10-socdk-atf"

# The Linux device tree file to use
LINUX_DTB_FILE = "socfpga_stratix10_socdk.dtb"
KERNEL_DEVICETREE = "altera/${LINUX_DTB_FILE}"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:chestnut = " \
    kernel-modules \
    "

# What to include in first partition of SD card
IMAGE_BOOT_FILES ?= " \
    ${UBOOT_BINARY} \
    Image \
    socfpga_stratix10_socdk.dtb \
    "
IMAGE_FSTYPES:append = " wic wic.bmap"
WKS_FILE = "chestnut.wks"
