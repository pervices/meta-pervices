# 		boot.scr.uimg \
# 		u-boot.itb \
# 		kernel.itb \
# 		Image \
# 		"


Add variables for wic creation of sdcard image
IMAGE_BOOT_FILES ?= " \
			${UBOOT_BINARY} \
			Image \
			socfpga_stratix10_socdk.dtb \
		    "

WKS_FILE ?= "sdimage.wks"
IMAGE_FSTYPES:append = " wic"

