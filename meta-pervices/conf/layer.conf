# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES:append = " ${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS:append = " meta-pervices"
BBFILE_PATTERN_meta-pervices := "^${LAYERDIR}/"

# Increase the layer priority
BBFILE_PRIORITY_meta-pervices = "6"
LAYERSERIES_COMPAT_meta-pervices = "master scarthgap"
