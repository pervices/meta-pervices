#@TYPE: Machine
#@NAME: arria5
#@DESCRIPTION: Machine configuration for the Arria V SoC" 

IMAGE_TYPE:arria5 ?= "gsrd"

KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE:arria5 = "intel/socfpga/socfpga_arria5_socdk.dtb"

EXTRA_IMAGEDEPENDS:append:arria5 = " hw-ref-design u-boot-socfpga-scr"

UBOOT_EXTLINUX_FDT_default = "../socfpga_arria5_socdk.dtb"
UBOOT_EXTLINUX_ROOT = "root=/dev/mmcblk0p2"
UBOOT_EXTLINUX_FDTDIR_default ?= "../"
UBOOT_EXTLINUX_KERNEL_ARGS_default ?= "rootwait rw earlycon"

IMAGE_BOOT_FILES:arria5 = " \
	socfpga_arria5_socdk.dtb \
	${KERNEL_IMAGETYPE} \
	extlinux.conf;extlinux/extlinux.conf \
	u-boot.scr \
        ${MACHINE}_${IMAGE_TYPE}_ghrd/soc_system.rbf;soc_system.rbf \
	"
